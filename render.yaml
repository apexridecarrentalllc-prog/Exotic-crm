services:
  - type: web
    name: ie-manager
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    nodeVersion: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_COMPANY_NAME
        sync: false
      - key: NEXT_PUBLIC_COMPANY_TAGLINE
        sync: false
      - key: NEXT_PUBLIC_INVOICE_TERMS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
